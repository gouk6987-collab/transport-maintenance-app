<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Register - 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='background.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 10px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        input, select {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-add {
            grid-column: 1 / -1;
            padding: 12px;
            font-size: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-search {
            padding: 10px 20px;
            background-color: #0d2740;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-print {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print:hover {
            background-color: #0056b3;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #444;
        }
        th {
            background-color: #1f2937;
        }
        th.mass-mgmt {
            background-color: #1d3557;
            color: #a8dadc;
        }

        /* Print styles: cleans up the output when printing to paper */
        @media print {
            .btn-print, .card, form, nav, button, .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
            }
            .container {
                background: transparent !important;
                max-width: 100% !important;
                padding: 0 !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            th, td {
                border: 1px solid #000000 !important;
                color: #000000 !important;
                padding: 6px !important;
            }
            th {
                background-color: #f2f2f2 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Vehicle Register - 2026</h1>
            <p class="no-print">Logged in as: <strong>{{ user }}</strong> | <a href="/logout" style="color: #ff6b6b;">Logout</a></p>
        </div>

        <div class="card">
            <h3>Add New Vehicle Entry</h3>
            <form method="POST" action="/add_vehicle">
                <div class="form-grid">
                    <div>
                        <label>Vehicle Type (PM/T/D)</label>
