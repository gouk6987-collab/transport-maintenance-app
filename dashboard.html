<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Register - 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='background.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 10px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85em;
            margin-bottom: 5px;
            color: #ccc;
        }
        input, select {
            padding: 8px;
            border-radius: 4px;
            border: 1fr solid #555;
            background: #222;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        th {
            background: rgba(255, 255, 255, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #dc3545;
            text-decoration: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Vehicle Register - 2026</h2>
            <div>
                <span>Logged in as: <strong>{{ user }}</strong></span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="card">
            <h3>Add New Vehicle</h3>
            <form action="{{ url_for('add_vehicle') }}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Vehicle Type</label>
                        <select name="vehicle_type">
                            <option value="Prime Mover">Prime Mover</option>
                            <option value="Rigid">Rigid</option>
                            <option value="Trailer">Trailer</option>
                            <option value="Dolly">Dolly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Registration Number</label>
                        <input type="text" name="registration_number" required>
                    </div>
                    <div class="form-group">
                        <label>Make</label>
                        <input type="text" name="make">
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" name="model">
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" name="year">
                    </div>
                    <div class="form-group">
                        <label>Last Roadworthy Date</label>
                        <input type="date" name="last_roadworthy_date">
                    </div>
                    <div class="form-group">
                        <label>VIN / Chassis No</label>
                        <input type="text" name="vin_chassis_no">
                    </div>
                    <div class="form-group">
                        <label>GCM Rating</label>
                        <input type="text" name="gcm_rating">
                    </div>
                    <div class="form-group">
                        <label>ATM Rating</label>
                        <input type="text" name="atm_rating">
                    </div>
                    <div class="form-group">
                        <label>PBS Permit No</label>
                        <input type="text" name="pbs_permit_no">
                    </div>
                    <div class="form-group">
                        <label>PBS Expiry Date</label>
                        <input type="date" name="pbs_expiry_date">
                    </div>
                    <div class="form-group">
                        <label>Date Added</label>
                        <input type="date" name="date_added">
                    </div>
                    <div class="form-group">
                        <label>Date Removed</label>
                        <input type="date" name="date_removed">
                    </div>
                </div>
                <button type="submit">Add Vehicle Entry</button>
            </form>
        </div>

            <h3>Vehicle Search & List</h3>
            <form method="GET" action="{{ url_for('dashboard')
